# =====================================================================
# c64-prg.cfg - ld65 linker configuration for C64U GameNet programs
# =====================================================================
#
# Produces a standard C64 .prg: a 2-byte load address followed by a
# BASIC SYS stub and the machine-language program, loaded at $0801.
#
# This configuration does not use the cc65 C runtime or c64.lib.
#
# The upper limit ($A000) keeps the program below the BASIC ROM area so
# that returning to BASIC remains safe. This is standard C64 memory-map
# knowledge, not yet confirmed by a project reference.

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    MAIN:     file = %O, start = %S,     size = $A000 - %S;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = MAIN,     type = bss, define = yes;
}
